<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>レスポンシブな1x4グリッド</title>
    <style>
      .container {
        display: flex;
        flex-direction: column; /* 縦に並べる */
        height: 200vh; /* 高さを80vhに設定 */
        width: 100%;
        box-sizing: border-box;
        gap: 10px;
        padding: 10px;
        overflow-y: auto; /* コンテンツがはみ出る場合にスクロール */
      }
      .box {
        flex: 1 1 calc(25% - 10px); /* 高さを25%に設定して4つ縦に並ぶようにする */
        border: 1px solid black;
        box-sizing: border-box;
        display: flex;
        flex-direction: column; /* 縦に並べる */
        align-items: center; /* 中央揃え */
        justify-content: center; /* 中央揃え */
        padding: 10px;
        text-align: center; /* テキストを中央揃え */
        min-height: 100px; /* 高さを調整 */
      }
      .box img {
        max-width: 100%;
        max-height: 60%; /* 画像がボックスの60%の高さに収まるように設定 */
        object-fit: cover;
      }
      .box p {
        margin: 0;
        padding: 0;
      }
    </style>
  </head>
  <body>
    <div>
      <h2>70110001</h2>
      <h3>CV01</h3>
    </div>
    <div class="container">
      <div class="box">
        <img src="test.png" alt="説明文" />
        <p>ここに説明を書きます</p>
      </div>
      <div class="box">
        <img src="test.png" alt="説明文" />
        <p>ここに説明を書きます</p>
      </div>
      <div class="box">
        <img src="test.png" alt="説明文" />
        <p>ここに説明を書きます</p>
      </div>
      <div class="box">
        <img src="test.png" alt="説明文" />
        <p>ここに説明を書きます</p>
      </div>
    </div>
  </body>
</html>
