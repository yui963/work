<!DOCTYPE html>
<html>
  <head>
    <script
      type="text/javascript"
      src="https://www.gstatic.com/charts/loader.js"
    ></script>
    <script type="text/javascript">
      google.charts.load("current", {
        packages: ["timeline"],
      });
      google.charts.setOnLoadCallback(function () {
        drawTimeline();
      });
      function drawTimeline() {
        var container = document.getElementById("timeline");
        var chart = new google.visualization.Timeline(container);
        var dataTable = new google.visualization.DataTable();
        dataTable.addColumn({ type: "string", id: "TestName" });
        dataTable.addColumn({ type: "number", id: "Start" });
        dataTable.addColumn({ type: "number", id: "End" });

        var array = [
          [
            "parseErrorNumMinusNone",
            new Date(0, 0, 0, 0, 0, 3608),
            new Date(0, 0, 0, 0, 0, 1000000),
          ],
          [
            "codeGenExpressionSub2Term",
            new Date(0, 0, 0, 0, 0, 12500),
            new Date(0, 0, 0, 0, 0, 1258800),
          ],
          [
            "codeGenExpressionSub3Term",
            new Date(0, 0, 0, 0, 0, 20000),
            new Date(0, 0, 0, 0, 0, 1800000),
          ],
        ];
        dataTable.addRows(array);

        var options = {
          timeline: {
            showBarLabels: false,
          },
          avoidOverlappingGridLines: false,
          width: "auto",
          height: 500,
        };

        chart.draw(dataTable, options);
      }
    </script>
  </head>
  <body>
    <div id="timeline"></div>
  </body>
</html>
