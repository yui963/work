    <script type="text/javascript">
        google.charts.load('current', {'packages':['corechart','table']});
        google.charts.setOnLoadCallback(drawChartForNum);
        google.charts.setOnLoadCallback(drawChartForRatio);

      function drawChartForNum() {

        var data = new google.visualization.DataTable();
        data.addColumn('number', 'time(mins)');
        data.addColumn('number','good model');
        data.addColumn("number", "yours");

        var dataTestNum = [##%%$$DATA$$%%##]
        data.addRows(dataTestNum);

        var options = {
          hAxis: {
            title: 'time(mins)',
            format: 'decimal'
          },
          vAxis:{
            title:'number of test cases'
          },
          interpolateNulls:true,
          series:{
            0:{color:'#DCDCDC',lineWidth:20,pointsVisible:false},
            1:{}
          },
          width: 800,
          height: 400
        };

        var chart = new google.visualization.LineChart(document.getElementById('linechart_material'));

        chart.draw(data, options);
      }

      function drawChartForRatio() {
        var data = new google.visualization.DataTable();
        data.addColumn('number', 'time(mins)');
        data.addColumn('number','good model');
        data.addColumn("number", "yours");

        var dataArrayA = [##%%$$DATAFORMODEL$$%%##];
        var dataArrayB = [##%%$$DATAFORRATIO$$%%##];

        for (var i = 0; i < dataArrayA.length; i++) {
          data.addRow([dataArrayA[i][0], dataArrayA[i][1], null]);
        }

        for (var i = 0; i < dataArrayB.length; i++) {
          data.addRow([dataArrayB[i][0], null, dataArrayB[i][1]]);
        }

        var options = {
          hAxis: {
            title: 'time(mins)',
            format: 'decimal'
          },
          vAxis:{
            title:'pass ratio'
          },
          interpolateNulls:true,
          series:{
            0:{color:'#DCDCDC',lineWidth:20,pointsVisible:false},
            1:{}
          },
          width: 800,
          height: 400
        };
        var chart = new google.visualization.LineChart(document.getElementById('linechart_ratio'));
        chart.draw(data, options);
      }
      function drawTable() {
        var data = new google.visualization.DataTable();
        data.addColumn('string', 'testName');
        data.addColumn('number', 'lifeTime');

        data.addRows(##%%$$DATAFORTABLE$$%%##);

        var table = new google.visualization.Table(document.getElementById('table'));
        table.draw(data, {showRowNumber: true, width: '100%', height: '100%'});
      }
    </script>
