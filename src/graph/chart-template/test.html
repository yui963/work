<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>レスポンシブな2x2グリッド</title>
    <style>
      .container {
        display: flex;
        flex-wrap: wrap;
        width: 100%;
        height: 80vh;
        box-sizing: border-box;
        gap: 10px;
        padding: 10px;
      }
      .box {
        width: calc(50% - 10px);
        height: calc(50% - 10px);
        border: 1px solid black;
        box-sizing: border-box;
      }
      .box img {
        max-width: 100%;
        max-height: 100%;
        object-fit: cover;
      }
    </style>
  </head>
  <body>
    <div>
      <h2>70110001</h2>
      <h3>CV01</h3>
    </div>
    <div class="container">
      <div class="box">
        <img src="test.png" alt="説明文" />
        <p>ここに説明を書きます</p>
      </div>
      <div class="box"></div>
      <div class="box"></div>
      <div class="box"></div>
    </div>
  </body>
</html>
