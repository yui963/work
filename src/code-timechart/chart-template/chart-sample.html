<html>
  <head>
    <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>

    <script type="text/javascript">
      google.charts.load("current", {packages:["timeline"]});
      google.charts.setOnLoadCallback(drawChart);
      function drawChart() {
    
        var container = document.getElementById('graph');
        var chart = new google.visualization.Timeline(container);
        var dataTable = new google.visualization.DataTable();
        dataTable.addColumn({ type: 'string', id: 'File' });
        dataTable.addColumn({ type: 'string', id: 'Action' });
        // dataTable.addColumn({ type: 'date', id: 'Start' });
        // dataTable.addColumn({ type: 'date', id: 'End' });
        dataTable.addColumn({ type: 'number', id: 'Start' });
        dataTable.addColumn({ type: 'number', id: 'End' });
        dataTable.addRows([
            ['F1', 'E1', 0, 100],
            ['F2', 'E2-1', 100, 200],
            ['F2', 'E2-2', 100, 300],
            ['F3', 'E3', 50, 250]
        ]);
        // dataTable.addRows([
        //   [ 'File1', 'Reading', new Date(1789, 3, 30, 12, 1, 0), new Date(1797, 2, 4) ],
        //   [ 'File1', 'Editting', new Date(1797, 2, 4), new Date(1801, 2, 4) ],
        //   [ 'File1', 'Thomas Jefferson', new Date(1801, 2, 4), new Date(1809, 2, 4) ],
        //   [ 'File2', 'John Adams', new Date(1789, 3, 21), new Date(1797, 2, 4)],
        //   [ 'File2', 'Thomas Jefferson', new Date(1797, 2, 4), new Date(1801, 2, 4)],
        //   [ 'File2', 'Aaron Burr', new Date(1789, 3, 29, 1, 1, 1), new Date(1805, 2, 4)],
        //   [ 'File2', 'George Clinton', new Date(1805, 2, 4), new Date(1812, 3, 20)],
        //   [ 'File3', 'John Jay', new Date(1789, 8, 25), new Date(1790, 2, 22)],
        //   [ 'File3', 'Thomas Jefferson', new Date(1790, 2, 22), new Date(1793, 11, 31)],
        //   [ 'File3', 'Edmund Randolph', new Date(1794, 0, 2), new Date(1795, 7, 20)],
        //   [ 'File3', 'Timothy Pickering', new Date(1795, 7, 20), new Date(1800, 4, 12)],
        //   [ 'File3', 'Charles Lee', new Date(1800, 4, 13), new Date(1800, 5, 5)],
        //   [ 'File3', 'John Marshall', new Date(1800, 5, 13), new Date(1801, 2, 4)],
        //   [ 'File3', 'Levi Lincoln', new Date(1801, 2, 5), new Date(1801, 4, 1)],
        //   [ 'File3', 'James Madison', new Date(1801, 4, 2), new Date(1809, 2, 3)]
        // ]);
        chart.draw(dataTable);
      }
    </script>
</head>
  <body>
    <div id="graph" style="height: 300px;"></div>
  </body>
</html>
